name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Type check & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Test Suite
        run: node scripts/test-audit.mjs

      - name: Type check (application sources)
        run: |
          npx tsc --noEmit > tsc.log 2>&1 || true
          if grep -E '^src/(App|components|lib)/' tsc.log; then
            echo "::error::Type errors in application sources"
            cat tsc.log
            exit 1
          fi
          echo "No type errors in src/App, src/components or src/lib"

      - name: Build
        run: npm run build

      - name: Upload build artefact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

